[project]
name = "keyhole"
version = "0.1.0"
description = "Real-time fraud spike detector for Razorpay Buildathon"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.100",
    "uvicorn[standard]>=0.23",
    "aiokafka>=0.9",
    "redis>=5.0",
    "scikit-learn==1.6.1",  # pinned: must match the Kaggle training env for model artifacts
    "joblib>=1.3",
    "numpy>=1.24",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.21",
    "httpx>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
