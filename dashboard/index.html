<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Keyhole — Fraud Spike Detector</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen">
    <div class="container mx-auto px-4 py-6">
        <header class="mb-8">
            <h1 class="text-3xl font-bold text-red-400">🔑 Keyhole</h1>
            <p class="text-gray-400">Real-time Fraud Spike Detection — Razorpay AI Buildathon</p>
            <div id="connection-status" class="inline-block px-2 py-1 rounded text-xs mt-2 bg-yellow-600">Connecting...</div>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-6">
            <div class="bg-gray-800 p-4 rounded-lg">
                <div class="text-gray-400 text-sm">Precision</div>
                <div id="precision" class="text-2xl font-bold text-green-400">-</div>
            </div>
            <div class="bg-gray-800 p-4 rounded-lg">
                <div class="text-gray-400 text-sm">Recall</div>
                <div id="recall" class="text-2xl font-bold text-blue-400">-</div>
            </div>
            <div class="bg-gray-800 p-4 rounded-lg">
                <div class="text-gray-400 text-sm">F1 Score</div>
                <div id="f1" class="text-2xl font-bold text-purple-400">-</div>
            </div>
            <div class="bg-gray-800 p-4 rounded-lg">
                <div class="text-gray-400 text-sm">Total Alerts</div>
                <div id="total-alerts" class="text-2xl font-bold text-red-400">-</div>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
            <div class="bg-gray-800 p-4 rounded-lg">
                <h2 class="text-lg font-semibold mb-3">Live Fraud Alerts</h2>
                <div id="alerts-container" class="space-y-2 max-h-96 overflow-y-auto">
                    <p class="text-gray-500">Waiting for alerts...</p>
                </div>
            </div>

            <div class="bg-gray-800 p-4 rounded-lg">
                <h2 class="text-lg font-semibold mb-3">Live Transactions <span id="txn-count" class="text-xs text-gray-500">(0)</span></h2>
                <div class="overflow-x-auto max-h-96 overflow-y-auto">
                    <table class="w-full text-sm">
                        <thead class="text-gray-400 border-b border-gray-700 sticky top-0 bg-gray-800">
                            <tr><th class="text-left py-1">Time</th><th class="text-right">Amount</th><th>Predicted</th><th>Actual</th></tr>
                        </thead>
                        <tbody id="txn-table"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
